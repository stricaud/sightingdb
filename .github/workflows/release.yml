name: Release

# Publishes to crates.io and cuts a GitHub Release with prebuilt binaries when
# a version tag is pushed:
#
#     cargo set-version 0.0.5   # or edit Cargo.toml by hand
#     git commit -am "Release 0.0.5" && git push
#     git tag v0.0.5 && git push origin v0.0.5
#
# Setup, once: create a crates.io API token scoped to publish-new +
# publish-update (https://crates.io/settings/tokens) and add it as the
# repository secret CARGO_REGISTRY_TOKEN. See the note at the bottom for the
# token-free alternative.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  # The version bump, the tag and the release all happen in this one run.
  # They cannot be split across workflows: a tag pushed with GITHUB_TOKEN does
  # not trigger a new workflow run, so a "prepare" workflow that tagged would
  # bump and tag and then nothing further would happen.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v (e.g. 0.5.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the tag must agree with the manifest, and the code must be sound.
  # ---------------------------------------------------------------------------
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      # Dispatched runs commit the version bump and push the tag.
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A dispatched run commits onto the branch, so it needs the branch
          # rather than a detached tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.ref }}

      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      # Either the tag already agrees with Cargo.toml, or this run is the one
      # that makes it agree. Publishing a number that no commit contains is
      # what this avoids: `cargo publish` uploads the manifest as it stands,
      # and `git checkout <tag>` has to reproduce it.
      - name: Resolve the version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
              echo "::error::'$version' is not a semantic version like 1.2.3"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "::error::Tag v$version already exists"
              exit 1
            fi

            # Only the first `version =` line, which is the one in [package].
            perl -0pi -e 's/^version = "[^"]*"/version = "'"$version"'"/m' Cargo.toml
            cargo update --workspace --offline || cargo update --workspace

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "Release $version"
            git tag "v$version"
            git push origin HEAD "refs/tags/v$version"
            echo "Bumped to $version and tagged v$version"
          else
            version="${TAG#v}"
            manifest="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
            echo "tag=$version  Cargo.toml=$manifest"
            if [ "$version" != "$manifest" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version \
          $manifest. Either bump Cargo.toml and re-tag, or delete this tag and use the \
          Release workflow from the Actions tab with version $version, which does the bump, \
          the commit and the tag for you."
              exit 1
            fi
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # A tag can point at a commit that never went through CI, so re-run the
      # checks here rather than assuming.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --verbose

      # Installed by hand rather than via rustsec/audit-check: that action runs
      # `cargo install cargo-audit` without `--locked`, which resolves the very
      # newest dependencies and can pull in crates needing a newer compiler than
      # the one in use. `--locked` uses cargo-audit's own lockfile instead, so
      # the build is reproducible and cannot drift above our toolchain.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
        env:
          # Don't impose this repository's lint policy on a third-party tool.
          RUSTFLAGS: ""

      - name: Audit dependencies
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Prebuilt binaries, one native runner per target so nothing is cross-compiled.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported image so the glibc floor stays low.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `vendored-openssl` builds OpenSSL from source and links it statically,
      # so the binary does not depend on the libssl of whoever runs it.
      - name: Build
        run: cargo build --release --locked --features vendored-openssl

      - name: Stage the archive
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          version="${TAG#v}"
          stage="sightingdb-${version}-${{ matrix.target }}"
          mkdir -p "$stage/etc"
          cp target/release/sightingdb "$stage/"
          cp README.md LICENSE "$stage/"
          cp etc/sightingdb.toml etc/acl.toml etc/log4rs.yml etc/sightingdb.service "$stage/etc/"
          tar czf "${stage}.tar.gz" "$stage"
          echo "ARCHIVE=${stage}.tar.gz" >> "$GITHUB_ENV"

      # The whole point of vendoring is that the binary carries its own
      # OpenSSL, so a leftover dynamic link is a broken release, not a warning.
      - name: Confirm the binary is self-contained
        run: |
          target/release/sightingdb --version
          if command -v ldd > /dev/null; then
            links="$(ldd target/release/sightingdb)"
          else
            links="$(otool -L target/release/sightingdb)"
          fi
          echo "$links"
          if echo "$links" | grep -qiE 'libssl|libcrypto'; then
            echo "::error::Binary still links OpenSSL dynamically; vendoring did not take effect"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The GitHub Release itself.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}
          # Full history so the generated notes can see the previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # A tag like v0.1.0-rc1 is a prerelease; v0.1.0 is not.
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $prerelease \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS

  # ---------------------------------------------------------------------------
  # crates.io. Kept separate so a registry hiccup does not cost you the binaries.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    # A crates.io release cannot be undone, only yanked. Add required reviewers
    # to this environment (Settings > Environments) to gate it behind an
    # approval; GitHub creates the environment on first use if it is missing.
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}

      # No rust-cache here on purpose: `cargo publish` builds from a freshly
      # packaged tarball, so the cache saves little, and its cleanup step walks
      # target/package/ and logs ENOENT errors for test directories that do not
      # exist.

      # `cargo publish` packages and builds the result before uploading, so a
      # crate that cannot be built from its own tarball fails here rather than
      # after it is public.
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

# ---------------------------------------------------------------------------
# Token-free alternative: Trusted Publishing
#
# crates.io can hand out a short-lived token over OIDC, so no long-lived secret
# needs to live in this repository. It has to be configured on the crate first
# (crates.io > your crate > Settings > Trusted Publishing), naming this
# repository and the workflow file `release.yml`, which means the crate must
# already exist — publish once with a token, then switch.
#
# To switch: give the publish job `permissions: id-token: write`, then replace
# the Publish step with:
#
#   - name: Authenticate to crates.io
#     uses: rust-lang/crates-io-auth-action@v1
#     id: auth
#   - name: Publish
#     run: cargo publish --locked
#     env:
#       CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
#
# The CARGO_REGISTRY_TOKEN secret can then be deleted.
# ---------------------------------------------------------------------------
