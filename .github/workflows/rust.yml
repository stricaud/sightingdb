name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The toolchain (and rustfmt/clippy) come from rust-toolchain.toml.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # Workflow shell cannot be exercised by cargo test and only fails when a
  # release is already under way, so it gets its own check.
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for unbound shell variables
        run: python3 .github/lint-workflows.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      # Installed by hand rather than via rustsec/audit-check: that action runs
      # `cargo install cargo-audit` without `--locked`, which resolves the very
      # newest dependencies and can pull in crates needing a newer compiler than
      # the one in use. `--locked` uses cargo-audit's own lockfile instead, so
      # the build is reproducible and cannot drift above our toolchain.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
        env:
          # Don't impose this repository's lint policy on a third-party tool.
          RUSTFLAGS: ""

      - name: Audit dependencies
        # Exceptions, with the reason each one exists, live in
        # .cargo/audit.toml, which cargo-audit reads from the working directory.
        run: cargo audit

      - name: Check the audit exceptions are still needed
        run: python3 .github/check-audit-ignores.py

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      # rust-toolchain.toml tracks stable, so without this nothing would notice
      # a change that quietly raised the floor below the `rust-version` we
      # publish. Read from the manifest so the two cannot drift apart.
      - name: Build with the declared MSRV
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          echo "Cargo.toml declares rust-version = $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --locked --all-targets
