name: Prepare release

# Bumps the version, commits it, and pushes the tag — which then triggers
# Release. Run it from the Actions tab with the version you want.
#
# The version is deliberately committed *before* the tag rather than derived
# from it: `cargo publish` uploads the manifest as it is in the tree, so a tag
# whose commit says something else would publish a manifest that matches no
# commit, and `git checkout <tag> && cargo build` would report the wrong
# version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v (e.g. 0.4.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Bump, commit and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the version and the tag
        run: |
          version="${{ inputs.version }}"
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "::error::'$version' is not a semantic version like 1.2.3"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Bump Cargo.toml and Cargo.lock
        run: |
          # Only the first `version =` line, which is the one in [package].
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/m' Cargo.toml
          cargo update --workspace --offline || cargo update --workspace
          grep -m1 '^version' Cargo.toml

      # A release that does not build helps nobody, and this is the last point
      # where it can be stopped without a tag existing.
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD "refs/tags/v$VERSION"

      - name: Summary
        run: |
          echo "Tagged **v$VERSION**. The Release workflow takes it from here." \
            >> "$GITHUB_STEP_SUMMARY"
