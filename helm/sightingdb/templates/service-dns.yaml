{{- if .Values.config.dns.enabled }}
{{/*
DNS wants both protocols on one port. Kept as its own Service so it can be a
LoadBalancer while the HTTP API stays inside the cluster — the DNS listener
answers without an API key, so what it exposes is public to whoever can reach
it.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sightingdb.fullname" . }}-dns
  labels:
    {{- include "sightingdb.labels" . | nindent 4 }}
  {{- with .Values.dnsService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dnsService.type }}
  {{- with .Values.dnsService.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- with .Values.dnsService.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.dnsService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.dnsService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - name: dns-udp
      # Clients ask on 53; the pod binds something above 1024, because it runs
      # unprivileged. The Service is what bridges the two.
      port: {{ int .Values.dnsService.port }}
      targetPort: dns-udp
      protocol: UDP
      {{- if and .Values.dnsService.nodePort (or (eq .Values.dnsService.type "NodePort") (eq .Values.dnsService.type "LoadBalancer")) }}
      nodePort: {{ .Values.dnsService.nodePort }}
      {{- end }}
    - name: dns-tcp
      port: {{ int .Values.dnsService.port }}
      targetPort: dns-tcp
      protocol: TCP
  selector:
    {{- include "sightingdb.selectorLabels" . | nindent 4 }}
{{- end }}
