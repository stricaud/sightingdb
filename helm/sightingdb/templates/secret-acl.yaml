{{- if not .Values.acl.existingSecret }}
{{- $name := printf "%s-acl" (include "sightingdb.fullname" .) }}
{{/*
The keys this release starts with: what `acl.keys` says, or one generated key
with full access if it says nothing.

A generated key has to survive `helm upgrade`, so the existing Secret is read
back and its key reused. `lookup` returns nothing when there is no cluster to
ask — `helm template`, or `--dry-run` without a server — and a fresh key is
rendered in that case; installing from such a rendering rather than with
`helm install` would therefore mint a new key each time. Set `acl.keys` if that
matters.
*/}}
{{- $keys := .Values.acl.keys }}
{{- if not $keys }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $previous := "" }}
{{- if $existing }}
{{- $previous = index $existing.data "admin-key" | default "" }}
{{- end }}
{{- $generated := ternary (b64dec $previous) (randAlphaNum 40) (ne $previous "") }}
{{- $keys = dict $generated "rw, admin" }}
{{- end }}
{{/* The first key carrying the admin grant, picked the same way every time. */}}
{{- $admin := "" }}
{{- range $key, $grants := $keys }}
{{- if and (eq $admin "") (contains "admin" (toString $grants)) }}
{{- $admin = $key }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sightingdb.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Seeded onto the data volume at start, because the management interface
  # rewrites this file and a mounted Secret is read-only. Keys created there
  # are therefore *not* reflected back here.
  acl.toml: |
    # Rendered by the sightingdb Helm chart from acl.keys.
    #
    # "<apikey>" = "<grant>[, <grant>...]"
    # grant: r | w | rw [:<namespace prefix>]  |  admin

    [acl]
    {{- range $key, $grants := $keys }}
    {{ $key | quote }} = {{ $grants | quote }}
    {{- end }}
  # The first key holding the admin grant, on its own, so the bootstrap job and
  # `helm test` can authenticate without parsing TOML in a shell — and so
  # `kubectl get secret ... -o jsonpath='{.data.admin-key}'` answers the only
  # question anyone asks of this Secret. Bringing your own acl.existingSecret
  # means putting the same entry in it.
  admin-key: {{ required "acl.keys has no key with the admin grant, so nothing could reach the management interface" $admin | quote }}
{{- end }}
