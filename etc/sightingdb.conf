[daemon]
# Set to false to run a DNS-only instance (see [dns] below).
enabled=true
listen_ip=0.0.0.0
listen_port=9999
authenticate=false
daemonize=false
log_level=debug
ssl=true
ssl_cert=ssl/cert.pem
ssl_key=ssl/key.pem
post_limit=2500000000
log_out=/var/log/sightingdb/sightingdb.log
log_err=/var/log/sightingdb/sightingdb.error.log

# Where the database is snapshotted. Comment this out (or leave it blank) to
# run purely in memory, losing everything when the process stops.
dbdir=/var/lib/sighting

# Seconds between snapshots. The database is always saved on a clean shutdown;
# this bounds how much is lost in a crash. 0 saves only on shutdown.
snapshot_interval=300

# Seconds between eviction sweeps, which reclaim expired values and the
# namespaces left empty by them. 0 disables the sweeper.
sweep_interval=60

# Hourly statistics buckets kept per value. 720 is 30 days. Without a limit,
# every value accumulates one bucket per hour for as long as it is written to.
# 0 keeps all of them.
stats_retention=720

# How long a shadow sighting (the record that something was searched for) is
# kept, in seconds. 0 keeps them forever, which means `_shadow/*` grows without
# bound. 2592000 is 30 days.
shadow_ttl=2592000

# API keys and what each may reach. Without this section every key restored
# from the snapshot gets full access, which is how older versions behaved.
#
#   <apikey> = <grant>[, <grant>...]
#
# A grant is r, w or rw, optionally scoped with :<namespace prefix>. Without a
# prefix the grant covers every namespace. Prefixes match whole path segments,
# so rw:feeds/misp covers feeds/misp/ips but not feeds/misp-internal.
#
# Keys are stored here in the clear, so keep this file readable only by the
# user the daemon runs as, and serve over TLS.
[acl]
changeme = rw
# analyst  = r
# feed-misp = rw:feeds/misp
# mixed     = r, w:staging

# Answer sightings over DNS, using the DNSBL conventions every security tool
# already speaks. Disabled unless this section is present.
#
# READ THIS BEFORE ENABLING: DNS has no authentication. The [acl] section above
# does not apply, so anything reachable here is readable by anyone who can send
# a UDP packet. Only the namespaces listed under [dns.namespaces] answer, the
# listener binds to loopback unless you change it, and rate_limit exists because
# an open UDP responder is a reflection amplifier.
#
#[dns]
#enabled=true
#listen_ip=127.0.0.1
#listen_port=5353
#zone=sdb.example.com
# TTL on answers, and how long resolvers cache a "never seen" reply.
#ttl=60
# Queries per second per source address; 0 disables the limit.
#rate_limit=100
#threads=2
# Whether a DNS lookup counts as a search. Off by default: it is an
# unauthenticated write path into _shadow/*.
#shadow=false

# Which namespaces answer, and how a value is spelled in the query name.
#   <label> = <namespace>:<ip|domain|base32>
# ip     4.3.2.1.malware.sdb.example.com   -> 1.2.3.4      (DNSBL convention)
# domain evil.com.domains.sdb.example.com  -> evil.com
# base32 <base32 of the value>.hashes.sdb.example.com
#[dns.namespaces]
#malware=malware/ips:ip
#domains=malware/domains:domain
#hashes=malware/hashes:base32

# Ingest sightings from a ZeroMQ publisher, such as MISP's. This is a SUB
# socket that connects out to a publisher you trust; nothing is exposed.
#[zmq]
#enabled=true
#endpoint=tcp://misp.example.com:50000
# MISP publishes "<topic> <json>"; subscribing to a prefix matches it.
#topics=misp_json_attribute,misp_json
# "misp" reads MISP attributes and events; "native" reads
# {"items":[{"namespace":..,"value":..,"timestamp":..}]}
#format=misp
# Only ingest attributes MISP flagged as actionable.
#require_to_ids=true
# Where unmapped attribute types go; blank discards them.
#default_namespace=
# TTL on ingested sightings, and seconds between reconnection attempts.
#ttl=0
#reconnect=5

# MISP attribute type -> namespace.
#[zmq.types]
#ip-src=misp/ips
#ip-dst=misp/ips
#domain=misp/domains
#hostname=misp/domains
#url=misp/urls
#md5=misp/hashes
#sha1=misp/hashes
#sha256=misp/hashes

# Importing STIX 2.1 bundles with --import-stix <file or directory>. Counts and
# time windows are taken from the bundle: an observed-data seen 12 times between
# two instants becomes 12 sightings spanning that window.
#[stix]
#default_namespace=
#ttl=0

# STIX observable type -> namespace. Note the DOT in file hashes: INI treats ':'
# as a key/value separator, so 'file:MD5' would parse as the key 'file'.
#[stix.types]
#ipv4-addr=stix/ips
#ipv6-addr=stix/ips
#domain-name=stix/domains
#url=stix/urls
#file.MD5=stix/hashes
#file.SHA-1=stix/hashes
#file.SHA-256=stix/hashes
